<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Review Level 2_Ms QA</title>

  <meta property="og:title" content="Review Level 2_Ms QA">
  <meta property="og:description" content="Chương Trình Ôn Tập Từ Vựng & Câu Từ - Hán Ngữ Level 2">
  <meta property="og:type" content="website">

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #00b900;
      --primary-dark: #008a00;
      --secondary: #1cb0f6;
      --danger: #ff4b4b;
      --warning: #ff9600;
      --gray-bg: #f7f7f7;
      --card-border: #e5e5e5;
      --text: #3c3c3c;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 15px; color: var(--text); min-height: 100vh; }
    
    /* ---------------- TRANG CHỦ (WELCOME SCREEN) ---------------- */
    #welcomeScreen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(135deg, #eef7f2 0%, #f4f5f8 50%, #e8f4f8 100%);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .welcome-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      max-width: 500px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05), 0 5px 15px rgba(0, 0, 0, 0.03);
      text-align: center;
      position: relative;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .welcome-decor {
      font-size: 24px;
      margin-bottom: 12px;
      letter-spacing: 6px;
      animation: floatSoft 4s ease-in-out infinite;
    }

    .welcome-greeting {
      font-size: 20px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .btn-start-review {
      background: linear-gradient(135deg, #00b900, #009900);
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 185, 0, 0.28);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-start-review:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 25px rgba(0, 185, 0, 0.38);
      background: linear-gradient(135deg, #00c900, #00a800);
    }

    /* ---------------- GIAO DIỆN HỌC HIỆN TẠI ---------------- */
    .container { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    
    header { text-align: center; border-bottom: 2px solid var(--card-border); padding-bottom: 15px; margin-bottom: 15px; }
    h1 { color: var(--primary); margin: 0 0 5px 0; font-size: 26px; }
    .subtitle { color: #666; font-size: 14px; font-weight: bold; }

    .section-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px 5px; border: 2px solid var(--card-border); background: var(--gray-bg); border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; color: #555; text-align: center; transition: all 0.2s; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary-dark); }

    .filter-card { background: #f8f9fa; border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 15px; margin-bottom: 20px; }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    select, input[type="number"] { padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; outline: none; }
    input[type="number"] { width: 70px; text-align: center; }

    .status-bar { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 15px; margin-bottom: 10px; }
    .hearts { color: var(--danger); font-size: 18px; }
    
    .progress-container { width: 100%; background: #e5e5e5; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
    .progress-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s ease; }
    
    .progress-text-soft {
      font-size: 13px;
      color: #666;
      font-weight: 600;
      text-align: right;
      margin-bottom: 12px;
    }

    .control-row { display: flex; justify-content: flex-end; margin-bottom: 15px; }
    .btn-pause { background: #fff3cd; color: #856404; border: 1.5px solid #ffeeba; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .btn-pause:hover { background: #ffe8a1; }

    .question-card { background: var(--gray-bg); border: 2px solid var(--card-border); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
    .type-tag { display: inline-block; background: var(--secondary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
    .question-text { font-size: 22px; font-weight: bold; color: #111; margin: 10px 0; }
    .sub-text { font-size: 15px; color: #666; }

    .options-grid { display: grid; gap: 10px; margin-bottom: 20px; }
    .btn-option { background: white; border: 2px solid var(--card-border); border-bottom-width: 4px; padding: 14px; border-radius: 12px; font-size: 17px; font-weight: bold; text-align: left; cursor: pointer; color: var(--text); }
    .btn-option:hover { background: #f1f1f1; }
    .btn-option.selected { border-color: var(--secondary); background: #e0f2fe; }

    .word-pool, .sentence-target { display: flex; flex-wrap: wrap; gap: 8px; min-height: 55px; padding: 10px; border-radius: 12px; margin-bottom: 15px; }
    .sentence-target { background: #fff; border: 2px dashed #bbb; align-items: center; }
    .word-pool { background: var(--gray-bg); border: 1px solid var(--card-border); }
    
    .word-chip { background: white; border: 2px solid var(--card-border); border-bottom-width: 3px; padding: 8px 14px; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; line-height: 1.2; user-select: none; }

    input[type="text"] { width: 100%; padding: 14px; font-size: 18px; border: 2px solid var(--card-border); border-radius: 12px; outline: none; margin-bottom: 15px; }
    input[type="text"]:focus { border-color: var(--secondary); }

    .btn-main { width: 100%; background: var(--primary); color: white; border: none; border-bottom: 4px solid var(--primary-dark); padding: 14px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
    .btn-main:hover { background: #00a000; }

    .hidden { display: none !important; }
    
    .feedback-box { padding: 15px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; text-align: center; }
    .feedback-box.correct { background: #d7ffb8; color: #2b7000; border: 2px solid #a5ed6e; }
    .feedback-box.wrong { background: #ffdfe0; color: #ea2b2b; border: 2px solid #ffc1c1; }

    .report-card { background: #f8f9fa; border: 2px solid var(--card-border); border-radius: 16px; padding: 20px; margin: 15px 0; text-align: left; }
    .report-stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #ddd; font-weight: bold; }
    .wrong-item { background: #fff0f0; border-left: 4px solid var(--danger); padding: 8px 12px; margin-top: 6px; border-radius: 4px; font-size: 14px; }

    #loading { text-align: center; font-size: 18px; color: #666; padding: 40px 0; }

    /* ---------------- TÚI MÙ CUỐI BUỔI (BLIND BOX) ---------------- */
    .blind-box-section { text-align: center; padding: 10px 0; animation: fadeIn 0.6s ease; }
    .blind-box-title { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 25px; }
    .blind-boxes-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
    .blind-box-wrapper { position: relative; cursor: pointer; }

    .blind-box {
      width: 85px; height: 95px;
      background: linear-gradient(145deg, #ffffff, #f0f4f8);
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .blind-box-icon { font-size: 32px; }
    .blind-box-sparkle { position: absolute; font-size: 12px; opacity: 0.7; }
    .sp-1 { top: 6px; right: 8px; animation: pulseSparkle 2s infinite alternate; }
    .sp-2 { bottom: 6px; left: 8px; animation: pulseSparkle 2s 1s infinite alternate; }

    .box-anim-1 { animation: boxFloat1 3.5s ease-in-out infinite; }
    .box-anim-2 { animation: boxFloat2 4s ease-in-out infinite; }
    .box-anim-3 { animation: boxFloat3 3.8s ease-in-out infinite; }

    .blind-box-wrapper:hover .blind-box {
      transform: translateY(-8px) scale(1.08);
      border-color: #38bdf8;
      box-shadow: 0 12px 25px rgba(56, 189, 248, 0.22);
    }

    .blind-box-wrapper.opening .blind-box { animation: boxOpenAnim 0.6s ease forwards !important; }
    .blind-box-wrapper.disabled { pointer-events: none; opacity: 0.4; filter: grayscale(0.5); transform: scale(0.92); }

    .quote-result-card {
      background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
      border: 2px solid #bbf7d0;
      border-radius: 20px;
      padding: 22px;
      margin-top: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.04);
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .quote-zh { font-size: 19px; font-weight: 700; color: #15803d; margin-bottom: 8px; line-height: 1.4; }
    .quote-vi { font-size: 15px; color: #4b5563; font-style: italic; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes floatSoft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes boxFloat1 { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-4px) rotate(-2deg); } 75% { transform: translateY(3px) rotate(2deg); } }
    @keyframes boxFloat2 { 0%, 100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(4px) rotate(2deg); } 70% { transform: translateY(-3px) rotate(-1.5deg); } }
    @keyframes boxFloat3 { 0%, 100% { transform: translateY(0) rotate(0deg); } 40% { transform: translateY(-3px) rotate(1.5deg); } 80% { transform: translateY(3px) rotate(-2deg); } }
    @keyframes pulseSparkle { from { opacity: 0.3; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }
    @keyframes boxOpenAnim { 0% { transform: scale(1) rotate(0deg); } 25% { transform: scale(1.15) rotate(-6deg); } 50% { transform: scale(1.2) rotate(6deg); } 75% { transform: scale(1.25) rotate(-3deg); } 100% { transform: scale(1.1) rotate(0deg); } }
  </style>
</head>
<body>

<!-- TRANG CHỦ (MÀN HÌNH CHÀO) -->
<div id="welcomeScreen">
  <div class="welcome-card">
    <div class="welcome-decor">🌿 ✨ 🌸 📖</div>
    <div class="welcome-greeting" id="welcomeGreeting">👋 欢迎回来！</div>
    <button class="btn-start-review" onclick="enterMainApp()">
      <span>开始复习</span>
      <span style="font-size: 20px;">→</span>
    </button>
  </div>
</div>

<div class="container">
  <header>
    <h1>📚 Review Level 2_Ms QA</h1>
    <div class="subtitle">Chương Trình Ôn Tập Từ Vựng & Câu Từ - Hán Ngữ Level 2</div>
  </header>

  <div id="loading">⏳ Đang tải dữ liệu từ file <b>Tu_vung_Han_ngu_Bai_1-30_gop.xlsx</b>...</div>

  <div id="app" class="hidden">
    <div class="section-tabs">
      <button class="tab-btn active" id="tab1" onclick="switchSection(1)">1. Ôn Từ Vựng</button>
      <button class="tab-btn" id="tab2" onclick="switchSection(2)">2. Sắp Xếp Câu</button>
      <button class="tab-btn" id="tab3" onclick="switchSection(3)">3. Luyện Gõ</button>
    </div>

    <div class="filter-card">
      <div style="font-weight: bold; margin-bottom: 5px;">🎯 Chọn bài học:</div>
      <div class="filter-row">
        <select id="modeSelect" onchange="handleModeChange()">
          <option value="single">Theo 1 bài cụ thể</option>
          <option value="range">Tùy chọn dải bài (Ví dụ: 1 đến 2)</option>
          <option value="all">Tất cả bài (Bài 1 - 30)</option>
        </select>

        <span id="singleSelectBox">
          <select id="singleLessonSelect" onchange="startRound()"></select>
        </span>

        <span id="rangeSelectBox" class="hidden">
          Từ Bài <input type="number" id="startLesson" value="1" min="1" max="30">
          đến Bài <input type="number" id="endLesson" value="2" min="1" max="30">
          <button style="padding: 7px 12px; border-radius: 8px; background: var(--secondary); color: white; border: none; font-weight: bold; cursor: pointer;" onclick="startRound()">Áp dụng</button>
        </span>
      </div>
    </div>

    <div class="status-bar">
      <div>Đang luyện: <span id="currentModeLabel" style="color: var(--primary);">Bài 1</span></div>
      <div class="hearts">❤ <span id="heartCount">5</span></div>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text-soft" id="progressTextSoft">Đã ôn: 0</div>

    <div class="control-row">
      <button class="btn-pause" onclick="pauseAndShowSummary()">⏸️ Tạm dừng & Kết thúc phiên</button>
    </div>

    <div id="quizArea">
      <div class="question-card">
        <span class="type-tag" id="typeTag">Loại bài tập</span>
        <div class="question-text" id="questionTitle">Nội dung</div>
        <div class="sub-text" id="questionSub">Hướng dẫn</div>
      </div>

      <div id="interactiveArea"></div>
      <div id="feedback" class="feedback-box hidden"></div>
      <button class="btn-main" id="actionBtn" onclick="handleAction()">Kiểm tra</button>
    </div>
  </div>
</div>

<script>
  let rawData = [];
  let currentQueue = [];
  let mistakeQueue = [];
  let recordHistory = [];
  let currentItem = null;
  let activeSection = 1;
  let hearts = 5;
  let totalInRound = 0;
  let completedInRound = 0;
  let isAnswered = false;
  let selectedOption = null;

  const STORAGE_KEY = 'review_level2_saved_progress';

  const HOME_GREETINGS = [
    "👋 欢迎回来！今天也要进步一点点哦～",
    "🌿 欢迎回来！一点一点，慢慢变熟悉。",
    "🌸 欢迎回来！很高兴又见到你。",
    "🌱 欢迎回来！有时间的时候，回来看看吧。",
    "👋 你好！欢迎来到你的中文复习小站。",
    "🍀 你的中文小天地，欢迎回来！",
    "📖 今天学什么？让我们开始吧！",
    "🌷 不用着急，按照自己的节奏学习就好。",
    "✨ 学过的知识，再见一次就更熟悉了。",
    "🌿 不求一次记住，慢慢熟悉就好。",
    "🐢 不急着走得快，慢慢走得远。",
    "🌼 欢迎回来！今天的你，比昨天多懂一点点。",
    "🌸 一点一点，慢慢来就好。"
  ];

  const BLIND_BOX_QUOTES = [
    { zh: "🌷 做得很好，今天也有一点收获。", vi: "Làm tốt lắm, hôm nay lại có thêm một chút thu hoạch rồi." },
    { zh: "🌱 一点一点积累，你会越来越好的！", vi: "Từng chút từng chút tích lũy, bạn sẽ ngày càng tốt hơn!" },
    { zh: "✨ 今天的努力，都不会白费。", vi: "Những nỗ lực hôm nay sẽ không uổng phí đâu." },
    { zh: "🌿 慢慢来，你已经做得很好了！", vi: "Cứ từ từ thôi, bạn đã làm rất tốt rồi!" },
    { zh: "📖 每一次复习，都是在为进步积累力量。", vi: "Mỗi lần ôn tập đều là một lần tích lũy cho sự tiến bộ." },
    { zh: "🍀 坚持自己的节奏，慢慢进步就好。", vi: "Cứ giữ nhịp độ của riêng mình, từ từ tiến bộ là được." },
    { zh: "🌸 今天也完成了一点点，继续加油！", vi: "Hôm nay lại hoàn thành thêm một chút rồi, tiếp tục cố lên nhé!" },
    { zh: "🌸 别着急，慢慢学，你会越来越熟悉的。", vi: "Đừng vội, cứ từ từ học, bạn sẽ ngày càng quen thuộc hơn." },
    { zh: "🌙 今天就到这里，辛苦了！", vi: "Hôm nay đến đây thôi, bạn đã vất vả rồi!" },
    { zh: "💌 感谢今天的几分钟，我们下次再见！", vi: "Cảm ơn bạn vì vài phút hôm nay, hẹn gặp lại lần sau!" },
    { zh: "☕ 今天辛苦了，有空再回来看看吧。", vi: "Hôm nay vất vả rồi, khi có thời gian lại ghé qua nhé." },
    { zh: "🌱 记住一点，也是一种进步。", vi: "Nhớ thêm được một chút cũng là một sự tiến bộ." },
    { zh: "👏 今天的复习完成啦，给自己一点掌声吧！", vi: "Phần ôn tập hôm nay hoàn thành rồi, hãy tự dành cho mình một tràng pháo tay nhé!" },
    { zh: "🌸 今天先到这里，期待下次再见。", vi: "Hôm nay tạm dừng ở đây, hẹn gặp bạn lần sau." },
    { zh: "☀️ 谢谢你的认真，祝你今天一切顺利！", vi: "Cảm ơn sự nghiêm túc của bạn, chúc bạn hôm nay mọi việc thuận lợi!" },
    { zh: "🌿 不求一次记住，慢慢熟悉就好。", vi: "Không cần nhớ ngay một lần, từ từ quen thuộc là được." },
    { zh: "🌷 不用每次都学很多，学一点就很好。", vi: "Không cần lần nào cũng học thật nhiều, học một chút cũng rất tốt." },
    { zh: "✨ 每复习一次，中文就离你更近一点。", vi: "Mỗi lần ôn tập, tiếng Trung lại gần bạn thêm một chút." },
    { zh: "🍃 今天记住的一个词， slow 也是 comfort。", vi: "Nhớ được một từ hôm nay cũng là một thu hoạch của hôm nay." },
    { zh: "🌱 今天多认识一点，明天就少陌生一点。", vi: "Hôm nay biết thêm một chút, ngày mai sẽ bớt xa lạ một chút." },

    { zh: "🐢 不急着走得快，慢慢走得远。", vi: "Không cần vội đi thật nhanh, cứ từ từ đi thật xa." },
    { zh: "📚 一个词，一个句子，慢慢就会越来越多。", vi: "Một từ, một câu, từ từ rồi sẽ ngày càng nhiều hơn." },
    { zh: "🌿 学过的内容，再见一次就会更熟悉。", vi: "Những điều đã học, gặp lại một lần sẽ càng quen thuộc hơn." },
    { zh: "💛 今天花的 these 时间，都很值得。", vi: "Khoảng thời gian bạn dành hôm nay đều rất đáng giá." }
  ];

  function initWelcomeGreeting() {
    const randomMsg = HOME_GREETINGS[Math.floor(Math.random() * HOME_GREETINGS.length)];
    document.getElementById('welcomeGreeting').innerText = randomMsg;
  }

  function enterMainApp() {
    document.getElementById('welcomeScreen').style.display = 'none';
  }

  function cleanPunctuation(str) {
    if (!str) return '';
    return str.replace(/[。？！，、；：""''（）《》,.?!;:—–\-~…\.]/g, '').trim();
  }

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'correct') {
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.setValueAtTime(160, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }
  }

  window.onload = function() {
    initWelcomeGreeting();

    fetch('Tu_vung_Han_ngu_Bai_1-30_gop.xlsx')
      .then(res => {
        if (!res.ok) throw new Error("Lỗi tải file");
        return res.arrayBuffer();
      })
      .then(buffer => {
        const wb = XLSX.read(buffer, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);
        
        rawData = json.map(r => ({
          lessonNum: parseInt(String(r['Bài'] || '').replace(/\D/g, '')) || 1,
          lessonStr: String(r['Bài'] || '').trim(),
          vocab: String(r['Từ tiếng Trung'] || r['Từ'] || '').trim(),
          pinyin: String(r['Pinyin'] || '').trim(),
          meaning: String(r['Nghĩa tiếng Việt'] || '').trim(),
          example_vi: r['Ví dụ tiếng Việt'] ? String(r['Ví dụ tiếng Việt']).trim() : '',
          example_cn: r['Ví dụ tiếng Trung'] ? String(r['Ví dụ tiếng Trung']).trim() : '',
          example_pinyin: r['Ví dụ pinyin'] ? String(r['Ví dụ pinyin']).trim() : ''
        })).filter(item => item.vocab && item.meaning);

        populateSingleLessons();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');

        if (!checkAndLoadSavedProgress()) {
          startRound();
        }
      })
      .catch(err => {
        document.getElementById('loading').innerHTML = `
          <div style="color:red; text-align:left;">
            ⚠ <b>Chưa tìm thấy file Tu_vung_Han_ngu_Bai_1-30_gop.xlsx!</b><br>
            Hãy chắc chắn bạn đã upload file Excel lên thư mục của dự án.
          </div>`;
      });
  };

  function saveCurrentProgress() {
    const state = {
      mode: document.getElementById('modeSelect').value,
      singleLesson: document.getElementById('singleLessonSelect').value,
      startLesson: document.getElementById('startLesson').value,
      endLesson: document.getElementById('endLesson').value,
      activeSection: activeSection,
      currentQueue: currentQueue,
      mistakeQueue: mistakeQueue,
      recordHistory: recordHistory,
      currentItem: currentItem,
      hearts: hearts,
      totalInRound: totalInRound,
      completedInRound: completedInRound,
      savedAt: new Date().toLocaleString('vi-VN')
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function clearSavedProgress() {
    localStorage.removeItem(STORAGE_KEY);
  }

  function checkAndLoadSavedProgress() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return false;

    try {
      const state = JSON.parse(saved);
      if (confirm(`📌 Phát hiện bài học dở dang (${state.completedInRound}/${state.totalInRound} câu) lưu lúc ${state.savedAt}.\n\nBạn có muốn tiếp tục bài học cũ không?`)) {
        activeSection = state.activeSection;
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
          if (idx + 1 === activeSection) btn.classList.add('active');
          else btn.classList.remove('active');
        });

        document.getElementById('modeSelect').value = state.mode;
        document.getElementById('singleLessonSelect').value = state.singleLesson;
        document.getElementById('startLesson').value = state.startLesson;
        document.getElementById('endLesson').value = state.endLesson;
        
        handleModeChange(false);

        currentQueue = state.currentQueue || [];
        mistakeQueue = state.mistakeQueue || [];
        recordHistory = state.recordHistory || [];
        currentItem = state.currentItem;
        hearts = state.hearts;
        totalInRound = state.totalInRound;
        completedInRound = state.completedInRound;

        document.getElementById('heartCount').innerText = hearts;
        updateProgress();

        if (currentItem) {
          renderQuiz();
        } else {
          nextQuestion();
        }
        return true;
      } else {
        clearSavedProgress();
        return false;
      }
    } catch(e) {
      clearSavedProgress();
      return false;
    }
  }

  function populateSingleLessons() {
    const select = document.getElementById('singleLessonSelect');
    select.innerHTML = '';
    const lessons = [...new Set(rawData.map(i => i.lessonNum))].sort((a,b)=>a-b);
    lessons.forEach(num => {
      select.innerHTML += `<option value="${num}">Bài ${num}</option>`;
    });
  }

  function switchSection(sec) {
    if (currentQueue.length > 0 && completedInRound > 0) {
      if (!confirm("Chuyển phần học sẽ khởi động lượt mới. Bạn có chắc chắn không?")) return;
    }
    clearSavedProgress();
    activeSection = sec;
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
      if (idx + 1 === sec) btn.classList.add('active');
      else btn.classList.remove('active');
    });
    resetQuizAreaUI();
    startRound();
  }

  function handleModeChange(shouldStartRound = true) {
    const mode = document.getElementById('modeSelect').value;
    document.getElementById('singleSelectBox').className = mode === 'single' ? '' : 'hidden';
    document.getElementById('rangeSelectBox').className = mode === 'range' ? '' : 'hidden';
    if (shouldStartRound) {
      clearSavedProgress();
      resetQuizAreaUI();
      startRound();
    }
  }

  function resetQuizAreaUI() {
    document.getElementById('quizArea').innerHTML = `
      <div class="question-card">
        <span class="type-tag" id="typeTag">Loại bài tập</span>
        <div class="question-text" id="questionTitle">Nội dung</div>
        <div class="sub-text" id="questionSub">Hướng dẫn</div>
      </div>
      <div id="interactiveArea"></div>
      <div id="feedback" class="feedback-box hidden"></div>
      <button class="btn-main" id="actionBtn" onclick="handleAction()">Kiểm tra</button>
    `;
  }

  function startRound() {
    const mode = document.getElementById('modeSelect').value;
    let filtered = [];
    let label = '';

    if (mode === 'single') {
      const selectedNum = parseInt(document.getElementById('singleLessonSelect').value);
      filtered = rawData.filter(i => i.lessonNum === selectedNum);
      label = `Bài ${selectedNum}`;
    } else if (mode === 'range') {
      const start = parseInt(document.getElementById('startLesson').value) || 1;
      const end = parseInt(document.getElementById('endLesson').value) || 1;
      filtered = rawData.filter(i => i.lessonNum >= start && i.lessonNum <= end);
      label = `Bài ${start} ➔ Bài ${end}`;
    } else {
      filtered = [...rawData];
      label = `Tất cả 30 Bài`;
    }

    document.getElementById('currentModeLabel').innerText = label;

    if (filtered.length === 0) {
      alert("⚠ Không tìm thấy dữ liệu bài tập thích hợp cho phần này!");
      return;
    }

    if (activeSection === 2) {
      filtered = filtered.filter(i => i.example_pinyin && i.example_vi);
      currentQueue = filtered.map(item => ({ ...item, taskType: 'sentence' })).sort(() => Math.random() - 0.5);
    } else if (activeSection === 3) {
      let typingList = [];
      filtered.forEach(item => {
        typingList.push({
          taskType: 'vocab',
          questionVi: item.meaning,
          targetCn: item.vocab,
          pinyinHint: item.pinyin,
          rawItem: item
        });

        if (item.example_cn && item.example_vi) {
          const exCns = item.example_cn.split('\n').map(s => s.trim()).filter(Boolean);
          const exVis = item.example_vi.split('\n').map(s => s.trim()).filter(Boolean);
          const exPys = item.example_pinyin.split('\n').map(s => s.trim()).filter(Boolean);

          exCns.forEach((cn, idx) => {
            typingList.push({
              taskType: 'sentence',
              questionVi: exVis[idx] || item.example_vi,
              targetCn: cn,
              pinyinHint: exPys[idx] || item.example_pinyin,
              rawItem: item
            });
          });
        }
      });

      currentQueue = typingList.sort(() => Math.random() - 0.5);
    } else {
      currentQueue = filtered.map(item => ({ ...item, taskType: 'vocab' })).sort(() => Math.random() - 0.5);
    }

    mistakeQueue = [];
    recordHistory = [];
    totalInRound = currentQueue.length;
    completedInRound = 0;
    hearts = 5;
    document.getElementById('heartCount').innerText = hearts;
    updateProgress();
    nextQuestion();
  }

  function updateProgress() {
    const pct = totalInRound > 0 ? (completedInRound / totalInRound) * 100 : 0;
    document.getElementById('progressBar').style.width = `${Math.min(pct, 100)}%`;
    
    let unitLabel = 'từ';
    if (activeSection === 2) unitLabel = 'câu';
    else if (activeSection === 3) unitLabel = 'mục';

    document.getElementById('progressTextSoft').innerText = `已复习：${completedInRound} 个 | Đã ôn: ${completedInRound} ${unitLabel}`;
  }

  function nextQuestion() {
    isAnswered = false;
    selectedOption = null;
    const feedback = document.getElementById('feedback');
    if (feedback) feedback.className = 'feedback-box hidden';
    
    const actionBtn = document.getElementById('actionBtn');
    if (actionBtn) actionBtn.innerText = 'Kiểm tra';

    if (currentQueue.length === 0) {
      clearSavedProgress();
      showSummaryReport(true);
      return;
    }

    currentItem = currentQueue.shift();
    saveCurrentProgress();
    renderQuiz();
  }

  function renderQuiz() {
    const area = document.getElementById('interactiveArea');
    if (!area) return;
    area.innerHTML = '';

    if (activeSection === 1) {
      const isCnToVi = Math.random() > 0.5;
      document.getElementById('typeTag').innerText = "PHẦN 1: ÔN TẬP TỪ VỰNG";

      if (isCnToVi) {
        document.getElementById('questionTitle').innerText = `${currentItem.vocab} (${currentItem.pinyin})`;
        document.getElementById('questionSub').innerText = "Chọn nghĩa tiếng Việt tương ứng:";
      } else {
        document.getElementById('questionTitle').innerText = currentItem.meaning;
        document.getElementById('questionSub').innerText = "Chọn từ tiếng Trung tương ứng:";
      }

      let distractors = rawData.filter(i => i.vocab !== currentItem.vocab).sort(() => Math.random() - 0.5).slice(0, 2);
      let options = [currentItem, ...distractors].sort(() => Math.random() - 0.5);

      let grid = document.createElement('div');
      grid.className = 'options-grid';

      options.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = isCnToVi ? opt.meaning : `${opt.vocab} (${opt.pinyin})`;
        btn.onclick = () => selectOption(btn, opt.vocab === currentItem.vocab);
        grid.appendChild(btn);
      });
      area.appendChild(grid);

    } else if (activeSection === 2) {
      document.getElementById('typeTag').innerText = "PHẦN 2: SẮP XẾP CÂU (PINYIN)";
      
      let rawPinyin = currentItem.example_pinyin.split('\n')[0].trim();
      let rawVi = currentItem.example_vi.split('\n')[0].trim();

      document.getElementById('questionTitle').innerText = rawVi;
      document.getElementById('questionSub').innerText = "Bấm chọn các từ Pinyin để ghép thành câu hoàn chỉnh:";

      let cleanPyStr = cleanPunctuation(rawPinyin);
      let pyWords = cleanPyStr.split(/\s+/).filter(w => w.length > 0);
      let shuffledPyWords = [...pyWords].sort(() => Math.random() - 0.5);

      area.innerHTML = `
        <div class="sentence-target" id="targetArea"></div>
        <div class="word-pool" id="poolArea"></div>
      `;

      const poolArea = document.getElementById('poolArea');
      const targetArea = document.getElementById('targetArea');

      shuffledPyWords.forEach((word) => {
        let chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.innerText = word;
        chip.onclick = () => {
          if (chip.parentElement === poolArea) {
            targetArea.appendChild(chip);
          } else {
            poolArea.appendChild(chip);
          }
        };
        poolArea.appendChild(chip);
      });

    } else if (activeSection === 3) {
      document.getElementById('typeTag').innerText = "PHẦN 3: LUYỆN GÕ TIẾNG TRUNG";
      document.getElementById('questionTitle').innerText = currentItem.questionVi;
      document.getElementById('questionSub').innerText = `Gợi ý Pinyin: ${currentItem.pinyinHint}`;

      area.innerHTML = `
        <input type="text" id="typeInput" placeholder="Gõ chữ Hán vào đây..." autocomplete="off">
      `;
    }
  }

  function selectOption(btn, isCorrect) {
    if (isAnswered) return;
    document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedOption = isCorrect;
  }

  function handleAction() {
    if (isAnswered) {
      nextQuestion();
      return;
    }

    let isCorrect = false;
    let correctText = '';

    if (activeSection === 1) {
      if (selectedOption === null) {
        alert("Vui lòng chọn một đáp án!");
        return;
      }
      isCorrect = selectedOption;
      correctText = `${currentItem.vocab} (${currentItem.pinyin}): ${currentItem.meaning}`;

    } else if (activeSection === 2) {
      const targetArea = document.getElementById('targetArea');
      const userWords = Array.from(targetArea.children).map(c => c.innerText.trim());
      const userSentence = userWords.join(' ');
      
      let rawPinyin = currentItem.example_pinyin.split('\n')[0].trim();
      let targetSentence = cleanPunctuation(rawPinyin).split(/\s+/).filter(Boolean).join(' ');

      isCorrect = (userSentence.toLowerCase() === targetSentence.toLowerCase());
      correctText = rawPinyin;

    } else if (activeSection === 3) {
      const userInput = document.getElementById('typeInput').value.trim();
      const targetCn = cleanPunctuation(currentItem.targetCn);
      const cleanedUserInput = cleanPunctuation(userInput);

      isCorrect = (cleanedUserInput === targetCn);
      correctText = currentItem.targetCn;
    }

    isAnswered = true;
    completedInRound++;
    updateProgress();

    const feedback = document.getElementById('feedback');
    feedback.classList.remove('hidden');

    if (isCorrect) {
      playSound('correct');
      feedback.className = 'feedback-box correct';
      feedback.innerText = '🎉 Chính xác! Tuyệt vời!';
      recordHistory.push({ item: currentItem, correct: true });
    } else {
      playSound('wrong');
      feedback.className = 'feedback-box wrong';
      feedback.innerText = `❌ Chưa đúng rồi! Đáp án chuẩn: ${correctText}`;
      
      hearts--;
      if (hearts < 0) hearts = 0;
      document.getElementById('heartCount').innerText = hearts;

      mistakeQueue.push(currentItem);
      recordHistory.push({ item: currentItem, correct: false });

      if (hearts === 0) {
        setTimeout(() => {
          alert("💔 Bạn đã hết tim! Hãy xem lại báo cáo lượt học này nhé.");
          showSummaryReport(false);
        }, 800);
        return;
      }
    }

    document.getElementById('actionBtn').innerText = 'Tiếp theo ➔';
    saveCurrentProgress();
  }

  function pauseAndShowSummary() {
    if (confirm("Bạn có muốn tạm dừng và xem tổng kết lượt học hiện tại không?")) {
      showSummaryReport(false);
    }
  }

  function showSummaryReport(isCompletedAll) {
    clearSavedProgress();
    
    let totalDone = recordHistory.length;
    let correctCount = recordHistory.filter(r => r.correct).length;
    let wrongCount = totalDone - correctCount;

    let wrongListHtml = '';
    if (mistakeQueue.length > 0) {
      wrongListHtml = `<div style="font-weight:bold; margin-top:15px; color:var(--danger);">Các mục cần ôn lại:</div>`;
      mistakeQueue.forEach(m => {
        let title = m.vocab ? `${m.vocab} (${m.pinyin})` : m.questionVi;
        let detail = m.meaning || m.targetCn || m.example_pinyin;
        wrongListHtml += `
          <div class="wrong-item">
            <b>${title}</b>: ${detail}
          </div>
        `;
      });
    }

    const quizArea = document.getElementById('quizArea');
    quizArea.innerHTML = `
      <div class="report-card">
        <h2 style="text-align:center; color:var(--primary); margin-top:0;">📊 TỔNG KẾT PHIÊN HỌC</h2>
        <div class="report-stat"><span>Trạng thái:</span> <span>${isCompletedAll ? '🎉 Hoàn thành bài học' : '⏸️ Tạm dừng giữa chừng'}</span></div>
        <div class="report-stat"><span>Tổng số câu đã làm:</span> <span>${totalDone}</span></div>
        <div class="report-stat"><span>Số câu đúng:</span> <span style="color:var(--primary);">${correctCount}</span></div>
        <div class="report-stat"><span>Số câu sai:</span> <span style="color:var(--danger);">${wrongCount}</span></div>
        ${wrongListHtml}
      </div>

      <div class="blind-box-section">
        <div class="blind-box-title">🎁 Chọn một túi mù để nhận lời nhắn hôm nay:</div>
        <div class="blind-boxes-container">
          <div class="blind-box-wrapper box-anim-1" onclick="openBlindBox(this, 0)">
            <div class="blind-box">
              <span class="blind-box-sparkle sp-1">✨</span>
              <span class="blind-box-icon">🎁</span>
              <span class="blind-box-sparkle sp-2">🌸</span>
            </div>
          </div>
          <div class="blind-box-wrapper box-anim-2" onclick="openBlindBox(this, 1)">
            <div class="blind-box">
              <span class="blind-box-sparkle sp-1">🌿</span>
              <span class="blind-box-icon">🎀</span>
              <span class="blind-box-sparkle sp-2">✨</span>
            </div>
          </div>
          <div class="blind-box-wrapper box-anim-3" onclick="openBlindBox(this, 2)">
            <div class="blind-box">
              <span class="blind-box-sparkle sp-1">✨</span>
              <span class="blind-box-icon">🧸</span>
              <span class="blind-box-sparkle sp-2">🌱</span>
            </div>
          </div>
        </div>
        <div id="quoteArea"></div>
      </div>

      <button class="btn-main" onclick="startRound()" style="margin-top:20px;">🔄 Luyện tập lại lượt mới</button>
    `;
  }

  function openBlindBox(element, index) {
    document.querySelectorAll('.blind-box-wrapper').forEach(el => {
      el.classList.add('disabled');
    });
    element.classList.remove('disabled');
    element.classList.add('opening');

    const randomQuote = BLIND_BOX_QUOTES[Math.floor(Math.random() * BLIND_BOX_QUOTES.length)];

    setTimeout(() => {
      document.getElementById('quoteArea').innerHTML = `
        <div class="quote-result-card">
          <div class="quote-zh">${randomQuote.zh}</div>
          <div class="quote-vi">${randomQuote.vi}</div>
        </div>
      `;
    }, 600);
  }
</script>
